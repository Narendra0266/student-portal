<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Spline Scene & Campus Gallery</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>
  
  <!-- Spline Viewer Script -->
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.0/build/spline-viewer.js"></script>
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#030712] text-neutral-100 min-h-screen flex flex-col items-center justify-start p-4 md:p-8 space-y-12 overflow-x-hidden">

  <!-- 1. Hero 3D Section -->
  <div class="w-full max-w-6xl mt-4">
    <div class="w-full h-auto md:h-[500px] bg-black/95 rounded-xl border border-neutral-900 shadow-2xl relative overflow-hidden flex flex-col md:flex-row">
      
      <!-- Aceternity Spotlight Animation SVG -->
      <svg class="spotlight-svg pointer-events-none absolute z-[1] h-[169%] w-[138%] lg:w-[84%] opacity-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3787 2842" fill="none">
        <g filter="url(#filter)">
          <ellipse cx="1924.71" cy="273.501" rx="1924.71" ry="273.501" transform="matrix(-0.822377 -0.568943 -0.568943 0.822377 3631.88 2291.09)" fill="white" fill-opacity="0.21"></ellipse>
        </g>
        <defs>
          <filter id="filter" x="0.860352" y="0.838989" width="3785.16" height="2840.26" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feFlood flood-opacity="0" result="BackgroundImageFix"></feFlood>
            <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"></feBlend>
            <feGaussianBlur stdDeviation="151" result="effect1_foregroundBlur_1065_8"></feGaussianBlur>
          </filter>
        </defs>
      </svg>
      
      <!-- Left Content -->
      <div class="flex-1 p-8 md:p-12 relative z-10 flex flex-col justify-center">
        <h1 class="text-4xl md:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-b from-neutral-50 to-neutral-400 leading-tight">
          Interactive 3D
        </h1>
        <p class="mt-4 text-neutral-400 text-sm md:text-base max-w-lg leading-relaxed">
          Bring your UI to life with beautiful 3D scenes. Create immersive experiences 
          that capture attention and enhance your design.
        </p>
      </div>

      <!-- Right Content: 3D Spline Scene -->
      <div class="flex-1 min-h-[300px] md:min-h-full relative w-full h-full">
        <!-- Spline Web Component -->
        <spline-viewer url="https://prod.spline.design/kZDDjO5HuC9GJUM2/scene.splinecode" class="w-full h-full absolute inset-0"></spline-viewer>
      </div>
      
    </div>
  </div>

  <!-- 2. Photo Gallery Section -->
  <div class="w-full max-w-6xl pb-16 px-4">
    <!-- Gallery Header -->
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between border-b border-neutral-900 pb-6 mb-8 gap-4">
      <div>
        <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-b from-neutral-50 to-neutral-400">
          Campus Life Gallery
        </h2>
        <p class="text-neutral-400 mt-2 text-sm max-w-md">
          Explore 30 snapshots capturing academic excellence, student initiatives, vibrant events, and athletics on campus.
        </p>
      </div>

      <!-- Category Filter Tabs -->
      <div class="flex flex-wrap gap-2" id="filter-tabs">
        <!-- Filter buttons will be generated by JS -->
      </div>
    </div>

    <!-- Photos Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="photos-grid">
      <!-- Photos will be generated dynamically by JS -->
    </div>
  </div>

  <!-- 3. Fullscreen Lightbox Modal -->
  <div id="lightbox-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl p-4 md:p-8 select-none hidden">
    
    <!-- Close button -->
    <button id="lightbox-close" class="absolute top-6 right-6 z-50 p-3 rounded-full bg-neutral-900/80 border border-neutral-850 text-neutral-400 hover:text-neutral-100 hover:bg-neutral-800 transition-all duration-300">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Prev button -->
    <button id="lightbox-prev" class="absolute left-4 md:left-8 z-40 p-3 rounded-full bg-neutral-900/80 border border-neutral-850 text-neutral-400 hover:text-neutral-100 hover:bg-neutral-800 transition-all duration-300">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- Center Content -->
    <div class="flex flex-col max-w-4xl w-full h-full max-h-[85vh] justify-center items-center gap-4">
      <div class="relative flex-1 w-full flex items-center justify-center overflow-hidden">
        <img id="lightbox-img" src="" alt="" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl transition-all duration-300">
      </div>

      <!-- Info panel -->
      <div class="text-center max-w-2xl px-4">
        <span id="lightbox-category" class="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-widest uppercase bg-neutral-900 border border-neutral-850 text-neutral-400 mb-2"></span>
        <h3 id="lightbox-title" class="text-xl md:text-2xl font-black text-neutral-50"></h3>
        <p id="lightbox-desc" class="text-neutral-400 text-xs md:text-sm mt-1.5 leading-relaxed"></p>
        <div id="lightbox-counter" class="text-neutral-500 text-xs mt-3"></div>
      </div>
    </div>

    <!-- Next button -->
    <button id="lightbox-next" class="absolute right-4 md:right-8 z-40 p-3 rounded-full bg-neutral-900/80 border border-neutral-850 text-neutral-400 hover:text-neutral-100 hover:bg-neutral-800 transition-all duration-300">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>

  </div>

  <!-- JavaScript script -->
  <script src="app.js"></script>
</body>
</html>
